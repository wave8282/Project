name: Python CI

on:
  push:
    branches:
      - feature/pose-dataset-pipeline
    paths:
      - "src/**"
      - "tests/**"
      - "requirements-pose.txt"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "requirements-pose.txt"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pose-dataset-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-pose.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pose.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile all Python modules
        run: python -m compileall -q src tests
